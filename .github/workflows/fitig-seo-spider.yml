name: FITIG Windows build
on:
  push:
    branches: [main]
    paths: ['**']
  pull_request:
    paths: ['**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: .
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          npm ci
          if ($LASTEXITCODE) { throw 'Desktop npm ci failed' }
          npm --prefix ui ci
          if ($LASTEXITCODE) { throw 'UI npm ci failed' }
      - name: Test engine and UI
        run: |
          cargo test --locked --manifest-path engine/Cargo.toml
          if ($LASTEXITCODE) { throw 'Engine tests failed' }
          npm --prefix ui test
          if ($LASTEXITCODE) { throw 'UI tests failed' }
          npm --prefix ui run test:core
          if ($LASTEXITCODE) { throw 'Core tests failed' }
      - name: Build unsigned installer and CLI
        run: |
          npm exec -- tauri build --bundles nsis --ci
          if ($LASTEXITCODE) { throw 'Installer build failed' }
          $env:PATH="$PWD/src-tauri/target/release;$env:PATH"
          cargo test --release --locked --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE) { throw 'Desktop unit tests failed' }
          cargo build --locked --release --manifest-path engine/Cargo.toml
          if ($LASTEXITCODE) { throw 'CLI build failed' }
      - name: Upload unsigned build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fitig-windows-unsigned
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            engine/target/release/fitig-engine.exe
